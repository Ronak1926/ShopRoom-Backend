name: security

on:
  push:
    branches: [development, main, master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the build on any known high or critical advisory in production dependencies.
      - run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        run: |
          pattern='(BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{10,}|rzp_live_[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{30,})'
          if git log --all -p -G"$pattern" --pretty=format:%h -- . ':!pnpm-lock.yaml' | grep -q .; then
            echo "A secret-shaped string was committed. Rotate it and remove it from history."
            exit 1
          fi
